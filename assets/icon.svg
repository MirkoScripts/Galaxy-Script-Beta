<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1533"/>
      <stop offset="100%" stop-color="#0E0C14"/>
    </linearGradient>
    <linearGradient id="gGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B47AFF"/>
      <stop offset="100%" stop-color="#8A3FFF"/>
    </linearGradient>
    <radialGradient id="starGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#C9A8FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A05AFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="none"
        stroke="#6E52C9" stroke-width="2" opacity="0.7"/>

  <!-- Subtle galaxy swirl -->
  <path d="M 30 90 Q 50 50 64 64 Q 78 78 98 38"
        fill="none" stroke="#A05AFF" stroke-width="2"
        stroke-linecap="round" opacity="0.35"/>
  <path d="M 30 40 Q 50 80 64 66 Q 78 52 98 92"
        fill="none" stroke="#FF9632" stroke-width="1.5"
        stroke-linecap="round" opacity="0.25"/>

  <!-- Stars -->
  <circle cx="24" cy="30" r="1.6" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="104" cy="26" r="1.2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="110" cy="98" r="1.5" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="20" cy="102" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="64" cy="18" r="0.9" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="64" cy="112" r="1.1" fill="#FFFFFF" opacity="0.55"/>

  <!-- Glow behind the G -->
  <circle cx="64" cy="64" r="34" fill="url(#starGrad)" opacity="0.35"/>

  <!-- The G letter -->
  <text x="64" y="88"
        font-family="'Gotham', 'Segoe UI', 'Arial Black', sans-serif"
        font-size="72" font-weight="900"
        text-anchor="middle"
        fill="url(#gGrad)"
        stroke="#3A2A66" stroke-width="0.8">G</text>

  <!-- Highlight on the G -->
  <text x="63" y="87"
        font-family="'Gotham', 'Segoe UI', 'Arial Black', sans-serif"
        font-size="72" font-weight="900"
        text-anchor="middle"
        fill="#D9BFFF" opacity="0.15">G</text>
</svg>
